services:
  nextcloud:
    image: nextcloud:34-apache
    ports:
      - "8080:80"
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      SQLITE_DATABASE: nextcloud
    volumes:
      - nextcloud-data:/var/www/html
      # The shared SELinux label lets Apache and local build/test containers
      # read the bind mount. The app itself stays read-only in the container.
      - ./:/var/www/html/custom_apps/butterfly:ro,z

volumes:
  nextcloud-data:
